<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程 API 授权</title><link rel="stylesheet" href="/content-access.css"><main>
<a href="/admin">返回课堂管理</a><h1>课程 API 授权</h1><p>通过统一账户多因素验证，授权应用读取已发布课程及编纂独立书籍。连接撤销不自动撤销已获准的书籍成果。</p><p id="status" role="status"></p><button id="mfa">验证统一账户身份</button>
<h2>授权与分发</h2><form id="approve"><label>应用<select id="application" name="application"></select></label>
<fieldset id="destination"><legend>BibleTree 接入目标</legend><p>在 BibleTree 的“接入教学实例”中复制本书接入请求，再在此粘贴。</p><button type="button" id="pasteRequest">一键粘贴接入请求</button><label>接入请求（也可手动粘贴）<textarea id="requestText" maxlength="10000" autocomplete="off"></textarea></label><button type="button" id="readRequest">填入接入目标</button><label>应用名称<input name="name" value="BibleTree课程接入" maxlength="100"></label><label>目标站点<input name="targetOrigin" type="url" placeholder="https://…"></label><label>目标书籍编号<input name="targetBook" maxlength="200"></label></fieldset>
<fieldset><legend>允许读取的课程版本</legend><div id="courses"></div></fieldset><label>授权小时数（最多720）<input name="hours" type="number" min="1" max="720" value="720" required></label><label>成果读者<select name="audience"><option value="members">指定统一账户</option><option value="authenticated">全部已登录统一账户</option></select></label><label>指定账户ID（每行一个）<textarea name="subjects"></textarea></label><label><input name="rights" type="checkbox" required>我有权授予所选内容的留存、编纂和持续展示权；应用连接到期或撤销不自动使已发布成果失效。</label><button id="grantSubmit">授权并复制接入信息</button></form>
<section id="handoffResult" hidden><h2>接入信息已生成</h2><p>包含应用密钥，仅交给目标书籍负责人。在 BibleTree“接入教学实例”一键粘贴。关闭本页后无法重新读取此密钥；需要时撤销旧连接再重新授权。</p><textarea id="issued" readonly aria-label="接入信息" autocomplete="off" spellcheck="false" rows="8"></textarea><button id="copyIssued" type="button">再次复制接入信息</button><button id="clearIssued" type="button">清除显示</button></section>
<h2>应用与授权</h2><div id="apps"></div></main><script type="module" src="/content-access.js"></script></html>
