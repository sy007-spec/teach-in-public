<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>课程 API 授权</title><link rel="stylesheet" href="/content-access.css"><main><a href="/admin">返回课堂管理</a><h1>课程 API 授权</h1><p>通过统一账户多因素验证，明确授权应用读取课程及编纂独立书籍。连接撤销不自动撤销已获准的书籍成果。</p><p id="status" role="status"></p><button id="mfa">验证统一账户身份</button><h2>新建应用</h2><form id="create"><label>应用名称<input name="name" required maxlength="100"></label><label>目标书籍标识<input name="target" required></label><button>创建应用</button></form><pre id="issued"></pre><h2>应用与授权</h2><div id="apps"></div><form id="approve"><label>应用<select id="application" name="application"></select></label><fieldset><legend>允许读取的课程版本</legend><div id="courses"></div></fieldset><label>授权小时数（最多720）<input name="hours" type="number" min="1" max="720" value="720"></label><label>成果读者<select name="audience"><option value="members">指定统一账户</option><option value="authenticated">全部已登录统一账户</option></select></label><label>指定账户ID（每行一个）<textarea name="subjects"></textarea></label><label><input name="rights" type="checkbox" required>我有权授予所选内容的留存、编纂和持续展示权；应用连接到期或撤销不自动使已发布成果失效。</label><button>明确批准授权</button></form></main><script type="module" src="/content-access.js"></script></html>
